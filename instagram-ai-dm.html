<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Instagram</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--s1:#121212;--s2:#1c1c1c;--s3:#262626;--s4:#363636;
  --text:#fff;--muted:#a8a8a8;--border:#363636;
  --accent:#0095f6;--like:#ed4956;--gold:#f5c518;
  --story:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
input,textarea,button,select{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:4px}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh}
.sidebar{width:245px;border-right:1px solid var(--border);padding:8px 12px 20px;position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:100;background:var(--bg);transition:width .2s}
.sidebar-logo{padding:26px 12px 18px;font-family:"Billabong","Dancing Script",cursive;font-size:26px;letter-spacing:-.5px;cursor:default;display:flex;align-items:center;gap:8px}
.nav-item{display:flex;align-items:center;gap:16px;padding:12px;border-radius:10px;cursor:pointer;border:none;background:none;color:var(--text);font-size:16px;width:100%;text-align:left;transition:background .1s;font-weight:400;position:relative}
.nav-item:hover{background:var(--s3)}
.nav-item.active{font-weight:700}
.nav-item.active svg{stroke-width:2.5}
.nav-icon{width:24px;height:24px;flex-shrink:0}
.sidebar-gap{flex:1}
.main{margin-left:245px;flex:1;display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
.content-wrap{display:flex;width:100%;max-width:975px;padding:0 20px}
.feed-col{flex:1;max-width:470px;padding:24px 0;margin:0 auto}
.right-col{width:290px;flex-shrink:0;padding:24px 0 24px 28px;position:sticky;top:0;max-height:100vh;overflow-y:auto}
.right-col::-webkit-scrollbar{display:none}

/* ── STORIES ── */
.stories-bar{display:flex;gap:16px;padding:8px 0 20px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:16px;scrollbar-width:none}
.stories-bar::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;border:none;background:none;color:var(--text)}
.story-ring{width:56px;height:56px;border-radius:50%;background:var(--story);padding:2.5px;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.story-ring:hover{opacity:.85}
.story-avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid var(--bg)}
.story-name{font-size:12px;max-width:64px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.your-story-add{position:relative}
.story-plus{position:absolute;bottom:0;right:0;width:18px;height:18px;background:var(--accent);border-radius:50%;border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;line-height:1}

/* ── POST CARD ── */
.post-card{background:var(--bg);margin-bottom:12px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.post-header{display:flex;align-items:center;padding:14px 16px;gap:10px}
.post-av{width:32px;height:32px;border-radius:50%;object-fit:cover;cursor:pointer;flex-shrink:0;border:1px solid var(--border)}
.post-user-info{flex:1;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.post-username{font-weight:600;font-size:14px;cursor:pointer;color:var(--text);background:none;border:none;padding:0}
.post-username:hover{color:var(--muted)}
.post-dot{color:var(--muted);font-size:12px}
.post-time{color:var(--muted);font-size:12px}
.post-more{background:none;border:none;color:var(--text);padding:4px 8px;margin-left:4px;border-radius:4px;display:flex;align-items:center}
.post-more:hover{background:var(--s3)}

/* Slideshow */
.post-slideshow{position:relative;aspect-ratio:1/1;overflow:hidden;background:#000}
.post-slides{display:flex;transition:transform .3s ease;height:100%}
.post-slide{flex-shrink:0;width:100%;height:100%}
.post-slide img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.slide-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2;font-size:14px;backdrop-filter:blur(4px)}
.slide-btn.prev{left:8px}
.slide-btn.next{right:8px}
.slide-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.slide-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);transition:background .2s}
.slide-dot.active{background:#fff}
.slide-count-badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:12px}

.post-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:pointer}
.post-actions{display:flex;align-items:center;padding:4px 8px}
.act-btn{background:none;border:none;color:var(--text);padding:8px;display:flex;align-items:center;border-radius:50%;transition:background .1s}
.act-btn:hover{background:var(--s3)}
.act-btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.act-btn.liked svg{fill:var(--like);stroke:var(--like);animation:heartPop .35s ease}
.act-btn.saved svg{fill:var(--text);stroke:var(--text)}
.act-save{margin-left:auto}
.post-likes{padding:2px 16px;font-weight:600;font-size:14px;cursor:pointer}
.post-caption{padding:4px 16px 2px;font-size:14px;word-break:break-word}
.post-caption .cap-user{font-weight:600;cursor:pointer;margin-right:4px}
.post-caption .cap-user:hover{color:var(--muted)}
.post-view-comments{padding:2px 16px;color:var(--muted);font-size:14px;cursor:pointer;background:none;border:none;display:block;text-align:left;width:auto}
.post-add-comment{display:flex;align-items:center;padding:8px 16px 12px;gap:8px;border-top:1px solid var(--border);margin-top:6px}
.post-comment-input{flex:1;background:none;border:none;color:var(--text);font-size:14px;outline:none}
.post-comment-input::placeholder{color:var(--muted)}
.post-post-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:14px;padding:0;opacity:.4;transition:opacity .2s;white-space:nowrap}
.post-post-btn.on{opacity:1}

/* ── RIGHT SIDEBAR ── */
.active-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.active-av{width:56px;height:56px;border-radius:50%;object-fit:cover;cursor:pointer;flex-shrink:0;border:1px solid var(--border)}
.active-info{flex:1;min-width:0}
.active-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.active-handle{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:12px}
.sugg-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sugg-title{color:var(--muted);font-weight:600;font-size:14px}
.see-all{font-size:12px;font-weight:600;color:var(--text);background:none;border:none}

/* ── EXPLORE ── */
.explore-wrap{padding:0;width:100%;max-width:935px}
.explore-search-bar{padding:16px 20px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)}
.explore-search{width:100%;max-width:400px;background:var(--s3);border:none;border-radius:10px;padding:10px 14px;color:var(--text);outline:none;font-size:16px}
.explore-search::placeholder{color:var(--muted)}
.explore-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.exp-tile{aspect-ratio:1;overflow:hidden;cursor:pointer;position:relative;background:var(--s3)}
.exp-tile.tall{grid-row:span 2}
.exp-tile img{width:100%;height:100%;object-fit:cover;transition:filter .2s,transform .2s}
.exp-tile:hover img{filter:brightness(.7);transform:scale(1.02)}
.exp-tile-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;background:rgba(0,0,0,.4)}
.exp-tile:hover .exp-tile-overlay{opacity:1}
.exp-like-count{color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.exp-multi-badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px;border-radius:8px}

/* ── REELS ── */
.reels-wrap{display:flex;flex-direction:column;align-items:center;padding:0;width:100%;max-width:500px;margin:0 auto}
.reel-card{width:100%;max-width:400px;height:88vh;position:relative;border-radius:12px;overflow:hidden;background:var(--s3);margin-bottom:16px;flex-shrink:0;cursor:pointer}
.reel-img{width:100%;height:100%;object-fit:cover}
.reel-overlay{position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,transparent 70%)}
.reel-user-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.reel-av{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.reel-username{font-weight:700;font-size:14px}
.reel-caption{font-size:14px;color:#eee;max-height:60px;overflow:hidden}
.reel-actions{position:absolute;right:12px;bottom:80px;display:flex;flex-direction:column;gap:24px;align-items:center}
.reel-act{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.reel-act svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.reel-act.liked svg{fill:var(--like);stroke:var(--like)}

/* ── PROFILE ── */
.profile-wrap{width:100%;max-width:935px;padding:30px 20px;margin:0 auto}
.profile-top{display:grid;grid-template-columns:150px 1fr;gap:20px 40px;margin-bottom:44px;align-items:start}
.profile-av-ring{width:150px;height:150px;border-radius:50%;background:var(--story);padding:3px;flex-shrink:0;cursor:pointer;position:relative}
.profile-av-ring:hover::after{content:'Change photo';position:absolute;inset:0;background:rgba(0,0,0,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;text-align:center;padding:20px}
.profile-av-img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg)}
.profile-right{padding-top:10px}
.profile-name-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.profile-uname{font-size:20px;font-weight:300}
.profile-action-btns{display:flex;gap:8px}
.profile-btn{padding:7px 16px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid var(--border);background:var(--s3);color:var(--text)}
.profile-btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.profile-btn.following{background:var(--s3)}
.profile-stats{display:flex;gap:40px;margin-bottom:16px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat-num{font-weight:700;font-size:16px}
.stat-lbl{font-size:14px;color:var(--muted)}
.profile-bio{font-size:14px;white-space:pre-wrap}
.profile-tabs{display:flex;justify-content:center;gap:0;border-top:1px solid var(--border);margin-top:16px}
.profile-tab{flex:1;max-width:180px;padding:16px 0;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;background:none;color:var(--muted);border-top:1px solid transparent;margin-top:-1px;display:flex;align-items:center;justify-content:center;gap:6px;transition:color .15s}
.profile-tab.active{color:var(--text);border-top-color:var(--text)}
.profile-posts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding-top:4px}
.profile-tile{aspect-ratio:1;overflow:hidden;cursor:pointer;position:relative;background:var(--s3)}
.profile-tile img{width:100%;height:100%;object-fit:cover;transition:filter .2s}
.profile-tile:hover img{filter:brightness(.75)}
.profile-multi-badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:2px 5px;border-radius:6px}

/* ── DM ── */
.dm-wrap{display:flex;height:100vh;width:100%;border:1px solid var(--border);border-top:none;border-bottom:none}
.dm-list{width:300px;min-width:300px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column}
.dm-list-hdr{padding:18px 20px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.dm-hdr-name{font-size:16px;font-weight:700}
.dm-conv-list{flex:1;overflow-y:auto}
.dm-conv-item{display:flex;align-items:center;gap:12px;padding:10px 20px;cursor:pointer;transition:background .1s;border:none;background:none;color:var(--text);width:100%;text-align:left}
.dm-conv-item:hover{background:var(--s2)}
.dm-conv-item.active{background:var(--s2)}
.dm-conv-av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border)}
.dm-conv-meta{flex:1;min-width:0}
.dm-conv-name{font-weight:600;font-size:14px;margin-bottom:2px}
.dm-conv-preview{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-conv-ai-badge{font-size:10px;background:#7c3aed33;color:#a78bfa;border:1px solid #7c3aed55;border-radius:10px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.dm-chat{flex:1;display:flex;flex-direction:column;min-width:0}
.dm-chat-hdr{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.dm-chat-av{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
.dm-chat-name{font-weight:600;font-size:15px}
.dm-chat-sub{font-size:12px;color:var(--muted)}
.dm-messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:6px}
.dm-msg{max-width:65%;padding:10px 14px;border-radius:22px;font-size:14px;line-height:1.45;word-break:break-word}
.dm-msg.sent{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.dm-msg.recv{background:var(--s3);color:var(--text);align-self:flex-start;border-bottom-left-radius:6px}
.dm-msg.typing{background:var(--s3);align-self:flex-start;border-bottom-left-radius:6px;padding:12px 16px}
.dm-input-area{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-shrink:0}
.dm-input{flex:1;background:transparent;border:1px solid var(--border);border-radius:22px;padding:10px 16px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.dm-input:focus{border-color:var(--muted)}
.dm-input::placeholder{color:var(--muted)}
.dm-send{background:none;border:none;color:var(--accent);font-weight:600;font-size:14px;padding:8px;opacity:.4;transition:opacity .2s}
.dm-send.on{opacity:1}
.dm-empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);padding:40px}
.dm-empty-icon{width:68px;height:68px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center}
.dm-empty-icon svg{width:32px;height:32px;fill:none;stroke:var(--muted);stroke-width:2}
.dm-empty-title{font-size:20px;font-weight:300;color:var(--text)}
.dm-empty-sub{font-size:14px;text-align:center}
.dm-no-accounts{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);padding:40px;text-align:center}

/* ── DM RIGHT PANEL ── */
.dm-right-panel{width:260px;min-width:260px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;background:var(--bg)}
.dm-rp-header{padding:14px 20px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.dm-rp-avatar-section{padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.dm-rp-avatar-wrap{position:relative;cursor:pointer;border-radius:50%}
.dm-rp-avatar-wrap:hover .dm-rp-avatar-overlay{opacity:1}
.dm-rp-avatar-img{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid var(--border);display:block}
.dm-rp-avatar-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;flex-direction:column;gap:2px}
.dm-rp-avatar-overlay span{font-size:10px;color:#fff;font-weight:600;text-align:center;line-height:1.2}
.dm-rp-name{font-weight:700;font-size:16px;text-align:center}
.dm-rp-handle{font-size:13px;color:var(--muted);text-align:center}
.dm-rp-bio{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;padding:0 4px}
.dm-rp-upload-btn{background:var(--s3);border:1px solid var(--border);border-radius:8px;padding:6px 14px;color:var(--text);font-size:12px;cursor:pointer;text-align:center;transition:all .15s;position:relative;overflow:hidden}
.dm-rp-upload-btn:hover{border-color:var(--accent);color:var(--accent)}
.dm-rp-upload-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
/* AI Settings section */
.dm-rp-ai-section{padding:16px 20px;border-bottom:1px solid var(--border)}
.dm-rp-section-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.dm-rp-toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dm-rp-toggle-label{font-size:13px;font-weight:500}
.dm-toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.dm-toggle input{opacity:0;width:0;height:0;position:absolute}
.dm-toggle-slider{position:absolute;inset:0;border-radius:22px;background:var(--s4);cursor:pointer;transition:background .2s}
.dm-toggle-slider::before{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s}
.dm-toggle input:checked+.dm-toggle-slider{background:#7c3aed}
.dm-toggle input:checked+.dm-toggle-slider::before{transform:translateX(18px)}
.dm-rp-field{margin-bottom:10px}
.dm-rp-field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.dm-rp-field select,.dm-rp-field input[type=text]{width:100%;background:var(--s3);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:12px;outline:none}
.dm-rp-field select:focus,.dm-rp-field input[type=text]:focus{border-color:#7c3aed}
.dm-rp-ai-status{font-size:11px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:5px}
.ai-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
.ai-dot.ok{background:#34d399}
.ai-dot.err{background:#f87171}
.dm-rp-test-btn{background:var(--s3);border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--muted);font-size:11px;cursor:pointer;transition:all .15s;margin-top:6px}
.dm-rp-test-btn:hover{border-color:#7c3aed;color:var(--text)}

/* typing dots */
.typing-dots{display:flex;gap:4px;align-items:center}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:tdot 1.2s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,100%{opacity:.2;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}

/* ── MODALS ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.post-modal{background:var(--bg);border:1px solid var(--border);border-radius:4px;display:flex;max-height:90vh;width:90vw;max-width:935px;overflow:hidden}
.pm-img-side{flex:1;min-width:0;background:var(--s3);display:flex;align-items:center;justify-content:center;position:relative}
.pm-img-side img{width:100%;height:100%;max-height:90vh;object-fit:contain;display:block}
.pm-slide-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);border:none;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2;font-size:16px;backdrop-filter:blur(4px)}
.pm-slide-btn.prev{left:10px}
.pm-slide-btn.next{right:10px}
.pm-slide-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.pm-slide-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}
.pm-slide-dot.active{background:#fff}
.pm-meta-side{width:340px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--border);max-height:90vh}
.pm-hdr{display:flex;align-items:center;padding:14px 16px;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.pm-av{width:32px;height:32px;border-radius:50%;object-fit:cover;cursor:pointer;border:1px solid var(--border)}
.pm-username{font-weight:600;font-size:14px;cursor:pointer;background:none;border:none;color:var(--text);padding:0}
.pm-comments{flex:1;overflow-y:auto;padding:16px}
.pm-comment{margin-bottom:14px;font-size:14px;line-height:1.5}
.pm-comment strong{font-weight:600;margin-right:5px;cursor:pointer}
.pm-comment strong:hover{color:var(--muted)}
.pm-comment time{color:var(--muted);font-size:11px;margin-left:6px}
.pm-actions{border-top:1px solid var(--border);padding:8px 16px 0;flex-shrink:0;display:flex;gap:0}
.pm-likes{padding:6px 16px 4px;font-weight:600;font-size:14px;flex-shrink:0}
.pm-caption{padding:0 16px 6px;font-size:14px;flex-shrink:0;word-break:break-word}
.pm-caption strong{font-weight:600;margin-right:4px;cursor:pointer}
.pm-add-comment{display:flex;align-items:center;padding:12px 16px;gap:8px;border-top:1px solid var(--border);flex-shrink:0}
.pm-comment-input{flex:1;background:none;border:none;color:var(--text);font-size:14px;outline:none}
.pm-comment-input::placeholder{color:var(--muted)}
.pm-post-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:14px;opacity:.4;transition:opacity .2s;white-space:nowrap}
.pm-post-btn.on{opacity:1}
.modal-close-btn{position:absolute;top:16px;right:16px;background:rgba(0,0,0,.6);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;z-index:201;line-height:1}
.modal-close-btn:hover{background:rgba(255,255,255,.15)}

/* Create post modal */
.create-modal{background:var(--s1);border-radius:12px;width:90vw;max-width:680px;overflow:hidden}
.create-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.create-title{font-size:16px;font-weight:600;flex:1;text-align:center}
.create-body{padding:24px;min-height:300px}
.upload-area{border:2px dashed var(--border);border-radius:10px;padding:48px 24px;text-align:center;cursor:pointer;transition:border-color .2s;position:relative}
.upload-area:hover{border-color:var(--muted)}
.upload-icon{font-size:48px;margin-bottom:12px}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.caption-area{padding:0 24px 24px}
.caption-textarea{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:14px;resize:none;outline:none;padding:8px 0;min-height:80px}
.caption-textarea::placeholder{color:var(--muted)}
.create-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end}
.share-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 20px;font-weight:600;font-size:14px}
.share-btn:disabled{opacity:.5;cursor:not-allowed}

/* Preview gallery in create modal */
.preview-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:16px}
.preview-thumb{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.preview-thumb img{width:100%;height:100%;object-fit:cover}
.preview-remove{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.7);border:none;color:#fff;width:20px;height:20px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;line-height:1}
.preview-add-more{aspect-ratio:1;border:2px dashed var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted);cursor:pointer;background:none;position:relative;overflow:hidden}
.preview-add-more input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

/* Settings modal */
.settings-modal{background:var(--s1);border-radius:12px;width:90vw;max-width:480px;overflow:hidden;max-height:90vh;overflow-y:auto}
.settings-hdr{padding:16px 20px;border-bottom:1px solid var(--border);font-size:16px;font-weight:600;text-align:center;position:sticky;top:0;background:var(--s1);z-index:1}
.settings-body{padding:24px}
.settings-section{margin-bottom:24px}
.settings-label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.settings-input{width:100%;background:var(--s3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.settings-input:focus{border-color:var(--accent)}
.settings-hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.settings-save{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:600;font-size:14px;margin-top:4px}
.settings-save:hover{background:#0086e0}
.accounts-section{margin-top:8px}
.acc-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;color:var(--text);width:100%;text-align:left}
.acc-item:last-child{border-bottom:none}
.acc-item:hover .acc-name{color:var(--muted)}
.acc-check{margin-left:auto;color:var(--accent);font-size:16px}
.acc-av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border)}
.acc-info{flex:1;min-width:0}
.acc-name{font-weight:600;font-size:14px}
.acc-handle{font-size:12px;color:var(--muted)}

.new-acc-input{background:var(--s3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;width:100%}
.new-acc-input:focus{border-color:var(--accent)}

.avatar-upload-wrap{display:flex;align-items:center;gap:12px}
.avatar-preview{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--border);flex-shrink:0}

.avatar-upload-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

/* ── CROP MODAL ── */
.crop-modal{background:var(--s1);border-radius:16px;width:90vw;max-width:480px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.8)}
.crop-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.crop-hdr-title{font-size:16px;font-weight:600}
.crop-apply-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 18px;font-weight:600;font-size:14px}
.crop-apply-btn:hover{background:#0086e0}
.crop-cancel-btn{background:none;border:none;color:var(--muted);font-size:14px;padding:7px 12px}
.crop-viewport-wrap{position:relative;width:100%;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.crop-viewport{position:relative;width:320px;height:320px;margin:24px auto;flex-shrink:0;cursor:grab;touch-action:none;user-select:none}
.crop-viewport:active{cursor:grabbing}
.crop-img-layer{position:absolute;top:0;left:0;transform-origin:center center;will-change:transform}
.crop-img-layer img{display:block;pointer-events:none;user-select:none}
.crop-overlay{position:absolute;inset:0;pointer-events:none}
.crop-overlay svg{width:100%;height:100%}
.crop-controls{padding:16px 24px 24px;display:grid;gap:14px}
.crop-slider-row{display:flex;align-items:center;gap:12px}
.crop-slider-label{font-size:13px;color:var(--muted);width:40px;flex-shrink:0}
.crop-slider{flex:1;accent-color:var(--accent);height:4px;cursor:pointer}
.crop-preview-row{display:flex;align-items:center;gap:16px;padding-top:4px}
.crop-preview-circle{width:64px;height:64px;border-radius:50%;overflow:hidden;border:2px solid var(--border);flex-shrink:0;background:var(--s3)}
.crop-preview-circle img{width:100%;height:100%;object-fit:cover}
.crop-preview-label{font-size:13px;color:var(--muted);line-height:1.5}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--s3);color:var(--text);padding:12px 20px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;border:1px solid var(--border)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── MISC ── */
.hidden{display:none!important}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);width:100%}
.empty-icon{font-size:48px;display:block;margin-bottom:16px}
@keyframes heartPop{0%{transform:scale(1)}30%{transform:scale(1.4)}60%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.post-card,.reel-card{animation:fadeIn .3s ease}

/* ── RESPONSIVE ── */
@media(max-width:1200px){.dm-right-panel{display:none}}
@media(max-width:1100px){.right-col,.content-wrap .right-col{display:none}}
@media(max-width:900px){.pm-meta-side{width:280px}}
@media(max-width:768px){
  .sidebar{width:72px;padding:8px 6px}
  .sidebar-logo{font-size:18px;padding:20px 8px 14px}

}

  .profile-top{grid-template-columns:90px 1fr;gap:12px 20px}
  .profile-av-ring{width:90px;height:90px}
}
</style>

// ═══════════════════════════════════════════════════
// CONSTANTS & STORAGE
// ═══════════════════════════════════════════════════
const SK='ig-clone-v5';
const AI_SK='ig-ai-settings-v1';

// ═══════════════════════════════════════════════════
// AI SETTINGS — stored separately so they persist cleanly
// ═══════════════════════════════════════════════════
let aiSettings={
  model:'llama3',
  port:'11434',
  enabledConvs:{},// {convId: true/false}
};

function loadAISettings(){
  try{
    const raw=localStorage.getItem(AI_SK);
    if(raw)Object.assign(aiSettings,JSON.parse(raw));
  }catch{}
}
function saveAISettings(){
  try{localStorage.setItem(AI_SK,JSON.stringify(aiSettings));}catch{}
}
function getOllamaBase(){return`http://localhost:${aiSettings.port||'11434'}`;}
function isAIEnabled(convId){return!!aiSettings.enabledConvs[convId];}

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
let S={
  accounts:[],posts:[],follows:[],saved:[],dms:{},
  activeId:null,view:'feed',profileId:null,activeConvId:null,
  initialized:false,storySeenIds:[],searchQuery:'',
};

// ═══════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════
const uid=()=>crypto.randomUUID();
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function timeAgo(ts){
  const diff=Date.now()-ts;
  if(diff<60000)return'just now';
  if(diff<3600000)return`${Math.floor(diff/60000)}m`;
  if(diff<86400000)return`${Math.floor(diff/3600000)}h`;
  if(diff<604800000)return`${Math.floor(diff/86400000)}d`;
  return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(ts);
}
function formatNum(n){if(n>=1000000)return(n/1000000).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'K';return String(n);}
let toastTimer;
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000);}

function makeAvatar(username,color,size=160){
  const c=document.createElement('canvas');c.width=size;c.height=size;
  const ctx=c.getContext('2d');
  const g=ctx.createLinearGradient(0,0,size,size);
  g.addColorStop(0,color);g.addColorStop(1,shiftColor(color,40));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(size/2,size/2,size/2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.arc(size*.35,size*.35,size*.35,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font=`bold ${Math.round(size*.38)}px -apple-system,Arial`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(username[0].toUpperCase(),size/2,size/2+2);
  return c.toDataURL('image/png');
}

function shiftColor(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,(n>>16)+amt),g=Math.min(255,((n>>8)&0xff)+amt),b=Math.min(255,(n&0xff)+amt);
  return`#${((r<<16)|(g<<8)|b).toString(16).padStart(6,'0')}`;
}

function resizeImage(file, maxW=1080, quality=0.88){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ═══════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════
function hydrate(){
  try{
    const raw=localStorage.getItem(SK);
    if(!raw)return;
    const d=JSON.parse(raw);
    Object.assign(S,d);
    if(!Array.isArray(S.accounts))S.accounts=[];
    if(!Array.isArray(S.posts))S.posts=[];
    if(!Array.isArray(S.follows))S.follows=[];
    if(!Array.isArray(S.saved))S.saved=[];
    if(!S.dms||typeof S.dms!=='object')S.dms={};
    if(!Array.isArray(S.storySeenIds))S.storySeenIds=[];
  }catch{localStorage.removeItem(SK);}
}

function persist(){
  try{localStorage.setItem(SK,JSON.stringify(S));}
  catch(e){console.warn('Storage full:',e);}
}

function init(){
  hydrate();
  loadAISettings();
  S.accounts=S.accounts.filter(a=>!a.fake);
  if(S.activeId&&!S.accounts.find(a=>a.id===S.activeId)){S.activeId=null;}
  if(!S.activeId&&S.accounts.length>0){S.activeId=S.accounts[0].id;}
  const validIds=new Set(S.accounts.map(a=>a.id));
  S.posts=S.posts.filter(p=>validIds.has(p.accountId));
  S.initialized=true;
  persist();
  render();
}

// ═══════════════════════════════════════════════════
// GETTERS
// ═══════════════════════════════════════════════════
const getAccount=id=>S.accounts.find(a=>a.id===id)||null;
const getActive=()=>getAccount(S.activeId);
const isFollowing=targetId=>S.follows.some(f=>f.followerId===S.activeId&&f.followingId===targetId);
const isLiked=post=>Array.isArray(post.likes)&&post.likes.includes(S.activeId);
const isSaved=postId=>S.saved.includes(postId);
const getConv=id=>{if(!S.dms[id])S.dms[id]=[];return S.dms[id];}
function getAvatar(account){return account?.avatarUrl||makeAvatar(account?.username||'?','#555',80);}
function getFeedPosts(){
  if(!S.activeId)return[];
  const followingIds=[...S.follows.filter(f=>f.followerId===S.activeId).map(f=>f.followingId),S.activeId];
  const unique=[...new Set(followingIds)];
  return S.posts.filter(p=>unique.includes(p.accountId)).sort((a,b)=>b.createdAt-a.createdAt);
}
function getPostImages(post){
  if(Array.isArray(post.images)&&post.images.length>0)return post.images;
  if(post.imageUrl)return[post.imageUrl];
  return[];
}

  else if(S.view==='dm')renderDMs(main);
  else if(S.view==='profile')renderProfile(main,S.profileId||S.activeId);
}

function renderPostCard(post){
  const acc=getAccount(post.accountId);if(!acc)return'';
  const liked=isLiked(post);const saved=isSaved(post.id);
  const likesCount=Array.isArray(post.likes)?post.likes.length:0;
  const images=getPostImages(post);
  const isSlide=images.length>1;

  const mediaHtml=isSlide
    ?`<div class="post-slideshow" id="slideshow-${post.id}">
        <div class="post-slides" id="slides-${post.id}">
          ${images.map(img=>`<div class="post-slide"><img src="${img}" onclick="openPostModal('${post.id}')"></div>`).join('')}
        </div>
        ${images.length>1?`<button class="slide-btn prev" onclick="slidePost('${post.id}',-1)">‹</button>
        <button class="slide-btn next" onclick="slidePost('${post.id}',1)">›</button>
        <div class="slide-dots" id="dots-${post.id}">
          ${images.map((_,i)=>`<div class="slide-dot${i===0?' active':''}" id="dot-${post.id}-${i}"></div>`).join('')}
        </div>
        <div class="slide-count-badge">${svg('layers')} ${images.length}</div>`:''}
      </div>`
    :`<img class="post-img" src="${images[0]||''}" onclick="openPostModal('${post.id}')">`;

  return`<div class="post-card" data-post-id="${post.id}">
    <div class="post-header">
      <img class="post-av" src="${getAvatar(acc)}" onclick="viewProfile('${post.accountId}')">
      <div class="post-user-info">
        <button class="post-username" onclick="viewProfile('${post.accountId}')">${esc(acc.username)}</button>
        <span class="post-dot">•</span>
        <span class="post-time">${timeAgo(post.createdAt)}</span>
      </div>
      <button class="post-more">${svg('dots')}</button>
    </div>
    ${mediaHtml}
    <div class="post-actions">
      <button class="act-btn${liked?' liked':''}" onclick="toggleLike('${post.id}');updateLikeBtn(this,'${post.id}')" title="Like">
        ${liked?I.heartFilled:I.heart}
      </button>
      <button class="act-btn" onclick="openPostModal('${post.id}')" title="Comment">
        ${I.comment}
      </button>
      <button class="act-btn" onclick="showToast('Link copied!')" title="Share">
        ${I.share}
      </button>
      <button class="act-btn act-save${saved?' saved':''}" onclick="toggleSave('${post.id}');this.classList.toggle('saved');this.innerHTML=isSaved('${post.id}')?I.bookmarkFilled:I.bookmark" title="Save">
        ${saved?I.bookmarkFilled:I.bookmark}
      </button>
    </div>
    ${likesCount>0?`<div class="post-likes" id="likes-${post.id}">${formatNum(likesCount)} like${likesCount!==1?'s':''}</div>`:`<div class="post-likes" id="likes-${post.id}"></div>`}
    ${post.caption?`<div class="post-caption"><span class="cap-user" onclick="viewProfile('${post.accountId}')">${esc(acc.username)}</span>${esc(post.caption)}</div>`:''}
    ${post.comments.length>1?`<button class="post-view-comments" onclick="openPostModal('${post.id}')">View all ${post.comments.length} comments</button>`:''}
    ${post.comments.length===1?`<div class="post-caption"><span class="cap-user">${esc(getAccount(post.comments[0].fromId)?.username||'user')}</span>${esc(post.comments[0].text)}</div>`:''}
    <div class="post-add-comment">
      <input class="post-comment-input" placeholder="Add a comment…" data-post="${post.id}" oninput="this.nextElementSibling.classList.toggle('on',this.value.trim().length>0)" onkeydown="if(event.key==='Enter'){quickComment(this)}">
      <button class="post-post-btn" onclick="quickComment(this.previousElementSibling)">Post</button>
    </div>
  </div>`;
}

const slideIdx={};
function slidePost(postId,dir){
  const post=S.posts.find(p=>p.id===postId);if(!post)return;
  const images=getPostImages(post);if(images.length<2)return;
  if(!slideIdx[postId])slideIdx[postId]=0;
  slideIdx[postId]=(slideIdx[postId]+dir+images.length)%images.length;
  const track=document.getElementById('slides-'+postId);
  if(track)track.style.transform=`translateX(-${slideIdx[postId]*100}%)`;
  images.forEach((_,i)=>{
    const dot=document.getElementById(`dot-${postId}-${i}`);
    if(dot)dot.classList.toggle('active',i===slideIdx[postId]);
  });
}

function updateLikeBtn(btn,postId){
  const post=S.posts.find(p=>p.id===postId);if(!post)return;
  const liked=isLiked(post);
  btn.innerHTML=liked?I.heartFilled:I.heart;
  btn.classList.toggle('liked',liked);
  const el=document.getElementById('likes-'+postId);
  if(el){const n=Array.isArray(post.likes)?post.likes.length:0;el.textContent=n>0?`${formatNum(n)} like${n!==1?'s':''}`:'';};
}

  if(fields)fields.style.cssText=enabled?'':'opacity:.45;pointer-events:none';

function renderConvListOnly(){

async function testOllamaConnection(){
  const dot=document.getElementById('ai-status-dot');
  const txt=document.getElementById('ai-status-text');
  if(!dot||!txt)return;
  dot.className='ai-dot';txt.textContent='Checking…';
  try{
    const r=await fetch(getOllamaBase()+'/api/tags',{signal:AbortSignal.timeout(3000)});
    if(r.ok){
      const data=await r.json();
      const models=(data.models||[]).map(m=>m.name);
      dot.className='ai-dot ok';
      txt.textContent=`Connected · ${models.length} model(s) available`;
      // Populate model select with available models
      const sel=document.getElementById('ai-model-select');
      if(sel){
        models.forEach(m=>{
          if(![...sel.options].find(o=>o.value===m)){
            const opt=document.createElement('option');
            opt.value=m;opt.textContent=m;
            sel.insertBefore(opt,sel.firstChild);
          }
        });
        if([...sel.options].find(o=>o.value===aiSettings.model))sel.value=aiSettings.model;
      }
    }else{throw new Error();}
  }catch{
    const dot2=document.getElementById('ai-status-dot');
    const txt2=document.getElementById('ai-status-text');
    if(dot2)dot2.className='ai-dot err';
    if(txt2)txt2.textContent='Ollama not reachable — run: ollama serve';
  }
}

// ── DM SEND with AI response ──────────────────────
async function handleDmSend(){
  const input=document.getElementById('dm-text-input');
  if(!input)return;
  const text=input.value.trim();
  if(!text||!S.activeConvId||!S.activeId)return;
  input.value='';
  document.getElementById('dm-send-btn')?.classList.remove('on');

  // Store message with sender's id — this is the fix for the refresh bug
  const conv=getConv(S.activeConvId);
  const msg={fromId:S.activeId,toId:S.activeConvId,text,ts:Date.now()};
  conv.push(msg);
  persist();

  // Append sent bubble immediately
  const msgs=document.getElementById('dm-messages');
  if(msgs){
    const div=document.createElement('div');
    div.className='dm-msg sent';
    div.textContent=text;
    msgs.appendChild(div);
    msgs.scrollTop=msgs.scrollHeight;
  }

  // Update conv list preview
  renderConvListOnly();

  // Trigger AI response if enabled
  if(isAIEnabled(S.activeConvId)){
    await generateAIResponse(S.activeConvId,text);
  }
}

// ── AI RESPONSE ────────────────────────────────────
async function generateAIResponse(convId,lastUserMessage){
  const acc=getAccount(convId);
  const active=getActive();
  if(!acc||!active)return;

  const msgs=document.getElementById('dm-messages');

  // Show typing indicator
  let typingEl=null;
  if(msgs){
    typingEl=document.createElement('div');
    typingEl.className='dm-msg recv typing';
    typingEl.innerHTML='<div class="typing-dots"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>';
    msgs.appendChild(typingEl);
    msgs.scrollTop=msgs.scrollHeight;
  }

  try{
    const conv=getConv(convId);
    // Build full conversation history for context (last 20 messages)
    const history=conv.slice(-20);

    const systemPrompt=`You are ${acc.username}${acc.displayName&&acc.displayName!==acc.username?` (${acc.displayName})`:''}${acc.bio?`. Bio: ${acc.bio}`:''}.
You are having a direct message conversation on Instagram with ${active.username}.
Stay completely in character as ${acc.username}. Respond naturally and conversationally — short Instagram DM style replies.
Do NOT break character, do NOT mention you are an AI.`;

    // Build messages array with correct roles
    const ollamaMessages=[{role:'system',content:systemPrompt}];
    history.slice(0,-1).forEach(m=>{
      ollamaMessages.push({
        role:m.fromId===S.activeId?'user':'assistant',
        content:m.text
      });
    });
    ollamaMessages.push({role:'user',content:lastUserMessage});

    const response=await fetch(getOllamaBase()+'/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:aiSettings.model||'llama3',
        messages:ollamaMessages,
        stream:true,
        options:{temperature:0.88,top_p:0.95}
      })
    });

    if(!response.ok)throw new Error(`Ollama ${response.status}`);

    // Remove typing indicator, add streaming bubble
    if(typingEl&&msgs)msgs.removeChild(typingEl);

    let streamBubble=null;
    if(msgs){
      streamBubble=document.createElement('div');
      streamBubble.className='dm-msg recv';
      msgs.appendChild(streamBubble);
    }

    const reader=response.body.getReader();
    const decoder=new TextDecoder();
    let fullText='';

    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      const chunk=decoder.decode(value,{stream:true});
      for(const line of chunk.split('\n')){
        if(!line.trim())continue;
        try{
          const obj=JSON.parse(line);
          if(obj.message?.content){
            fullText+=obj.message.content;
            if(streamBubble)streamBubble.textContent=fullText;
            if(msgs)msgs.scrollTop=msgs.scrollHeight;
          }
        }catch{}
      }
    }

    // Store AI reply with convId as fromId — the KEY fix for the refresh bug
    if(fullText.trim()){
      const aiMsg={fromId:convId,toId:S.activeId,text:fullText.trim(),ts:Date.now(),isAI:true};
      const c=getConv(convId);
      c.push(aiMsg);
      persist();
      renderConvListOnly();
    }

  }catch(err){
    if(typingEl&&msgs&&msgs.contains(typingEl))msgs.removeChild(typingEl);
    if(msgs){
      const errEl=document.createElement('div');
      errEl.className='dm-msg recv';
      errEl.style.cssText='color:#f87171;border:1px solid #f8717133;font-size:12px';
      errEl.textContent=`⚠️ AI error: ${err.message} — Is Ollama running?`;
      msgs.appendChild(errEl);
      msgs.scrollTop=msgs.scrollHeight;
    }
  }
}

// ═══════════════════════════════════════════════════
// CROP MODAL ENGINE
// ═══════════════════════════════════════════════════
let _crop={img:null,zoom:1,x:0,y:0,vpSize:320,imgW:0,imgH:0,baseScale:1,dragging:false,lastX:0,lastY:0,onDone:null};

function openCropModal(file,onDone){
  _crop.onDone=onDone;
  _crop.zoom=1;_crop.x=0;_crop.y=0;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      _crop.img=img;_crop.imgW=img.naturalWidth;_crop.imgH=img.naturalHeight;
      _crop.baseScale=Math.max(_crop.vpSize/_crop.imgW,_crop.vpSize/_crop.imgH);
      _buildCropModal();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function _buildCropModal(){
  const existing=document.getElementById('crop-modal-layer');
  if(existing)existing.remove();
  const layer=document.createElement('div');
  layer.id='crop-modal-layer';
  layer.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px';
  layer.innerHTML=`
  <div class="crop-modal">
    <div class="crop-hdr">
      <button class="crop-cancel-btn" id="crop-cancel">Cancel</button>
      <div class="crop-hdr-title">Crop Profile Photo</div>
      <button class="crop-apply-btn" id="crop-apply">Apply</button>
    </div>
    <div class="crop-viewport-wrap">
      <div class="crop-viewport" id="crop-vp">
        <div class="crop-img-layer" id="crop-img-layer">
          <img id="crop-src-img" src="${_crop.img.src}" draggable="false">
        </div>
        <div class="crop-overlay">
          <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
            <defs><mask id="circleMask"><rect width="320" height="320" fill="white"/><circle cx="160" cy="160" r="156" fill="black"/></mask></defs>
            <rect width="320" height="320" fill="rgba(0,0,0,0.62)" mask="url(#circleMask)"/>
            <circle cx="160" cy="160" r="156" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="crop-controls">
      <div class="crop-slider-row">
        <span class="crop-slider-label">Zoom</span>
        <input class="crop-slider" type="range" id="crop-zoom" min="1" max="4" step="0.01" value="1">
      </div>
      <div class="crop-preview-row">
        <div class="crop-preview-circle"><canvas id="crop-preview-canvas" width="64" height="64"></canvas></div>
        <div class="crop-preview-label">Live preview<br><span style="color:var(--muted);font-size:12px">Drag to reposition · Scroll to zoom</span></div>
      </div>
    </div>
  </div>`;
  document.body.appendChild(layer);
  _cropApplyTransform();_cropUpdatePreview();
  document.getElementById('crop-cancel').onclick=()=>layer.remove();
  document.getElementById('crop-apply').onclick=_cropApply;
  document.getElementById('crop-zoom').oninput=e=>{
    _crop.zoom=parseFloat(e.target.value);
    _cropConstrain();_cropApplyTransform();_cropUpdatePreview();
  };
  const vp=document.getElementById('crop-vp');
  vp.addEventListener('mousedown',e=>{_crop.dragging=true;_crop.lastX=e.clientX;_crop.lastY=e.clientY;e.preventDefault();});
  window.addEventListener('mousemove',_onCropMouseMove);
  window.addEventListener('mouseup',()=>{_crop.dragging=false;});
  vp.addEventListener('touchstart',e=>{if(e.touches.length===1){_crop.dragging=true;_crop.lastX=e.touches[0].clientX;_crop.lastY=e.touches[0].clientY;}e.preventDefault();},{passive:false});
  vp.addEventListener('touchmove',e=>{
    if(!_crop.dragging||e.touches.length!==1)return;
    const dx=e.touches[0].clientX-_crop.lastX,dy=e.touches[0].clientY-_crop.lastY;
    _crop.lastX=e.touches[0].clientX;_crop.lastY=e.touches[0].clientY;
    _crop.x+=dx;_crop.y+=dy;_cropConstrain();_cropApplyTransform();_cropUpdatePreview();e.preventDefault();
  },{passive:false});
  vp.addEventListener('touchend',()=>{_crop.dragging=false;});
  vp.addEventListener('wheel',e=>{
    e.preventDefault();
    const delta=e.deltaY>0?-0.08:0.08;
    _crop.zoom=Math.max(1,Math.min(4,_crop.zoom+delta));
    document.getElementById('crop-zoom').value=_crop.zoom;
    _cropConstrain();_cropApplyTransform();_cropUpdatePreview();
  },{passive:false});
}

function _onCropMouseMove(e){
  if(!_crop.dragging)return;
  const dx=e.clientX-_crop.lastX,dy=e.clientY-_crop.lastY;
  _crop.lastX=e.clientX;_crop.lastY=e.clientY;
  _crop.x+=dx;_crop.y+=dy;_cropConstrain();_cropApplyTransform();_cropUpdatePreview();
}

function _cropConstrain(){
  const scale=_crop.baseScale*_crop.zoom;
  const sw=_crop.imgW*scale,sh=_crop.imgH*scale,vp=_crop.vpSize;
  const maxX=Math.max(0,(sw-vp)/2),maxY=Math.max(0,(sh-vp)/2);
  _crop.x=Math.max(-maxX,Math.min(maxX,_crop.x));
  _crop.y=Math.max(-maxY,Math.min(maxY,_crop.y));
}

function _cropApplyTransform(){
  const layer=document.getElementById('crop-img-layer');
  const img=document.getElementById('crop-src-img');
  if(!layer||!img)return;
  const scale=_crop.baseScale*_crop.zoom;
  const w=_crop.imgW*scale,h=_crop.imgH*scale;
  img.style.width=w+'px';img.style.height=h+'px';
  layer.style.transform=`translate(${(_crop.vpSize-w)/2+_crop.x}px,${(_crop.vpSize-h)/2+_crop.y}px)`;
}

function _cropUpdatePreview(){
  const canvas=document.getElementById('crop-preview-canvas');
  if(!canvas||!_crop.img)return;
  const ctx=canvas.getContext('2d');
  const out=64,scale=_crop.baseScale*_crop.zoom;
  const sw=_crop.imgW*scale,sh=_crop.imgH*scale;
  const imgLeft=(_crop.vpSize-sw)/2+_crop.x,imgTop=(_crop.vpSize-sh)/2+_crop.y;
  const srcX=(0-imgLeft)/scale,srcY=(0-imgTop)/scale,srcW=_crop.vpSize/scale,srcH=_crop.vpSize/scale;
  ctx.clearRect(0,0,out,out);ctx.save();
  ctx.beginPath();ctx.arc(out/2,out/2,out/2,0,Math.PI*2);ctx.clip();
  ctx.drawImage(_crop.img,srcX,srcY,srcW,srcH,0,0,out,out);ctx.restore();
}

function _cropApply(){
  if(!_crop.img||!_crop.onDone)return;
  const out=400,canvas=document.createElement('canvas');
  canvas.width=out;canvas.height=out;
  const ctx=canvas.getContext('2d'),scale=_crop.baseScale*_crop.zoom;
  const sw=_crop.imgW*scale,sh=_crop.imgH*scale;
  const imgLeft=(_crop.vpSize-sw)/2+_crop.x,imgTop=(_crop.vpSize-sh)/2+_crop.y;
  const srcX=(0-imgLeft)/scale,srcY=(0-imgTop)/scale,srcW=_crop.vpSize/scale,srcH=_crop.vpSize/scale;
  ctx.beginPath();ctx.arc(out/2,out/2,out/2,0,Math.PI*2);ctx.clip();
  ctx.drawImage(_crop.img,srcX,srcY,srcW,srcH,0,0,out,out);
  const dataUrl=canvas.toDataURL('image/jpeg',0.92);
  document.getElementById('crop-modal-layer')?.remove();
  _crop.onDone(dataUrl);
}

  modalSlideIdx=0;renderPostModalContent(post,acc);
}

function renderPostModalContent(post,acc){
  const liked=isLiked(post);const saved=isSaved(post.id);
  const likeCount=Array.isArray(post.likes)?post.likes.length:0;
  const images=getPostImages(post);
  const isMulti=images.length>1;
  const currImg=images[modalSlideIdx]||images[0]||'';
  wrapModal(`<div class="post-modal">
    <div class="pm-img-side">
      <img id="pm-main-img" src="${currImg}">
      ${isMulti?`
        <button class="pm-slide-btn prev" onclick="shiftModalSlide('${post.id}',-1)">‹</button>
        <button class="pm-slide-btn next" onclick="shiftModalSlide('${post.id}',1)">›</button>
        <div class="pm-slide-dots">
          ${images.map((_,i)=>`<div class="pm-slide-dot${i===modalSlideIdx?' active':''}" id="pmdot-${i}"></div>`).join('')}
        </div>`:''}
    </div>
    <div class="pm-meta-side">
      <div class="pm-hdr">
        <img class="pm-av" src="${getAvatar(acc)}" onclick="clearModal();viewProfile('${acc.id}')">
        <button class="pm-username" onclick="clearModal();viewProfile('${acc.id}')">${esc(acc.username)}</button>
        <button class="post-more" style="margin-left:auto">${svg('dots')}</button>
      </div>
      <div class="pm-comments" id="pm-comments-list">
        ${post.caption?`<div class="pm-comment"><strong onclick="clearModal();viewProfile('${acc.id}')">${esc(acc.username)}</strong>${esc(post.caption)}<time>${timeAgo(post.createdAt)}</time></div>`:''}
        ${post.comments.map(c=>{const ca=getAccount(c.fromId);return`<div class="pm-comment"><strong onclick="clearModal();viewProfile('${c.fromId||''}')">${esc(ca?.username||'user')}</strong>${esc(c.text)}<time>${timeAgo(c.createdAt)}</time></div>`;}).join('')}
      </div>
      <div class="pm-actions">
        <button class="act-btn${liked?' liked':''}" id="pm-like-btn" onclick="toggleLikeModal('${post.id}')" title="Like">${liked?I.heartFilled:I.heart}</button>
        <button class="act-btn" onclick="document.getElementById('pm-comment-input').focus()" title="Comment">${I.comment}</button>
        <button class="act-btn" onclick="showToast('Shared!')" title="Share">${I.share}</button>
        <button class="act-btn act-save${saved?' saved':''}" onclick="toggleSave('${post.id}');this.classList.toggle('saved')" title="Save">${saved?I.bookmarkFilled:I.bookmark}</button>
      </div>
      <div class="pm-likes" id="pm-likes-count">${formatNum(likeCount)} like${likeCount!==1?'s':''}</div>
      ${post.caption?`<div class="pm-caption"><strong onclick="clearModal();viewProfile('${acc.id}')">${esc(acc.username)}</strong>${esc(post.caption)}</div>`:''}
      <div class="pm-add-comment">
        <input class="pm-comment-input" id="pm-comment-input" placeholder="Add a comment…" oninput="document.getElementById('pm-post-btn').classList.toggle('on',this.value.trim().length>0)" onkeydown="if(event.key==='Enter'){document.getElementById('pm-post-btn').click()}">
        <button class="pm-post-btn" id="pm-post-btn" onclick="addCommentModal('${post.id}')">Post</button>
      </div>
    </div>
  </div>`);
}

function shiftModalSlide(postId,dir){
  const post=S.posts.find(p=>p.id===postId);if(!post)return;
  const images=getPostImages(post);if(images.length<2)return;
  modalSlideIdx=(modalSlideIdx+dir+images.length)%images.length;
  const img=document.getElementById('pm-main-img');
  if(img)img.src=images[modalSlideIdx];
  images.forEach((_,i)=>{const dot=document.getElementById('pmdot-'+i);if(dot)dot.classList.toggle('active',i===modalSlideIdx);});
}

function toggleLikeModal(postId){
  const post=S.posts.find(p=>p.id===postId);if(!post)return;
  toggleLike(postId);
  const liked=isLiked(post);
  const btn=document.getElementById('pm-like-btn');
  if(btn){btn.innerHTML=liked?I.heartFilled:I.heart;btn.classList.toggle('liked',liked);}
  const lc=document.getElementById('pm-likes-count');
  if(lc){const n=Array.isArray(post.likes)?post.likes.length:0;lc.textContent=`${formatNum(n)} like${n!==1?'s':''}`;}
}

function addCommentModal(postId){
  const input=document.getElementById('pm-comment-input');if(!input)return;
  const text=input.value.trim();if(!text)return;
  addComment(postId,text);
  input.value='';document.getElementById('pm-post-btn')?.classList.remove('on');
  const post=S.posts.find(p=>p.id===postId);
  const list=document.getElementById('pm-comments-list');
  if(list&&post){
    const newC=post.comments[post.comments.length-1];
    const ca=getAccount(newC.fromId);
    const div=document.createElement('div');div.className='pm-comment';
    div.innerHTML=`<strong>${esc(ca?.username||'user')}</strong>${esc(newC.text)}<time>just now</time>`;
    list.appendChild(div);div.scrollIntoView({behavior:'smooth'});
  }
}

function openStory(userId){
  const acc=getAccount(userId);if(!acc)return;
  const posts=S.posts.filter(p=>p.accountId===userId);
  if(!posts.length){showToast(`${acc.username} has no posts yet`);return;}
  const post=posts[Math.floor(Math.random()*posts.length)];
  const imgs=getPostImages(post);
  wrapModal(`<div style="width:min(400px,100%);height:min(700px,90vh);border-radius:12px;overflow:hidden;background:var(--s3);position:relative;flex-shrink:0">
    <img src="${imgs[0]||''}" style="width:100%;height:100%;object-fit:cover">
    <div style="position:absolute;top:0;left:0;right:0;padding:16px;background:linear-gradient(180deg,rgba(0,0,0,.6) 0%,transparent 100%)">
      <div style="height:2px;background:rgba(255,255,255,.4);border-radius:2px;margin-bottom:12px"><div style="height:100%;background:#fff;border-radius:2px;animation:storyProg 5s linear forwards" onanimationend="clearModal()"></div></div>
      <div style="display:flex;align-items:center;gap:8px">
        <img style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #fff" src="${getAvatar(acc)}">
        <div>
          <div style="font-weight:700;font-size:14px;color:#fff">${esc(acc.username)}</div>
          <div style="font-size:12px;color:rgba(255,255,255,.7)">${timeAgo(post.createdAt)}</div>
        </div>
      </div>
    </div>
  </div>`);
  document.head.insertAdjacentHTML('beforeend','<style>@keyframes storyProg{from{width:0}to{width:100%}}</style>');
  if(!S.storySeenIds.includes(userId)){S.storySeenIds.push(userId);persist();}
}

// ─── Create Post Modal ───
let pendingImages=[];

function openCreateModal(){
  if(!S.activeId){showToast('Create an account first!');openSettingsModal();return;}
  pendingImages=[];renderCreateModal();
}

function renderCreateModal(){
  wrapModal(`<div class="create-modal">
    <div class="create-hdr">
      <button onclick="clearModal()" style="background:none;border:none;color:var(--text);font-size:14px">Cancel</button>
      <div class="create-title">Create new post</div>
      <div style="width:60px"></div>
    </div>
    <div class="create-body" id="create-body">
      ${pendingImages.length===0?`
        <div class="upload-area">
          <div class="upload-icon">🖼️</div>
          <p style="font-size:16px;margin-bottom:8px">Drag photos here</p>
          <p style="font-size:14px;color:var(--muted);margin-bottom:16px">or select up to 10 images for a slideshow</p>
          <button onclick="document.getElementById('create-file-input').click()" style="background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:600">Select photos</button>
          <input type="file" accept="image/*" multiple id="create-file-input" style="display:none" onchange="handleCreateFiles(this.files)">
        </div>
      `:`
        <div id="preview-gallery" class="preview-gallery">
          ${pendingImages.map((url,i)=>`<div class="preview-thumb">
            <img src="${url}">
            <button class="preview-remove" onclick="removePendingImage(${i})">×</button>
          </div>`).join('')}
          ${pendingImages.length<10?`<button class="preview-add-more" title="Add more photos">
            +<input type="file" accept="image/*" multiple onchange="handleCreateFiles(this.files)">
          </button>`:''}
        </div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:16px;padding:0 4px">${pendingImages.length} image${pendingImages.length!==1?'s':''} selected${pendingImages.length>1?' — will post as a slideshow':''}</p>
        <textarea class="caption-textarea" id="new-post-caption" placeholder="Write a caption…" rows="3" style="width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:14px;resize:none;outline:none;padding:8px 0"></textarea>
        <div style="padding:16px 0 0;display:flex;justify-content:flex-end">
          <button class="share-btn" onclick="submitNewPost()">Share</button>
        </div>
      `}
    </div>
  </div>`);
}

async function handleCreateFiles(fileList){
  const files=Array.from(fileList).filter(f=>f.type.startsWith('image/'));
  if(!files.length)return;
  showToast('Processing images…');
  const newUrls=await Promise.all(files.map(f=>resizeImage(f,1080,0.88)));
  pendingImages=[...pendingImages,...newUrls].slice(0,10);
  renderCreateModal();
}

function removePendingImage(idx){
  pendingImages.splice(idx,1);renderCreateModal();
}

function submitNewPost(){
  if(!pendingImages.length||!S.activeId)return;
  const caption=document.getElementById('new-post-caption')?.value||'';
  const post={id:uid(),accountId:S.activeId,images:pendingImages,imageUrl:pendingImages[0],caption,comments:[],likes:[],createdAt:Date.now()};
  S.posts.unshift(post);
  pendingImages=[];
  persist();clearModal();render();showToast('Post shared! ✨');
}

// ─── Settings Modal ───
let newAccAvatarUrl=null;

function openSettingsModal(){
  newAccAvatarUrl=null;
  wrapModal(`<div class="settings-modal">
    <div class="settings-hdr">⚙️ Settings</div>
    <div class="settings-body">
      <div class="settings-section">
        <div class="settings-label">Accounts</div>
        <div class="accounts-section">
          ${S.accounts.length===0?`<p style="color:var(--muted);font-size:14px">No accounts yet. Create one below!</p>`:''}
          ${S.accounts.map(a=>`<button class="acc-item" onclick="switchAccount('${a.id}')">
            <img class="acc-av" src="${getAvatar(a)}">
            <div class="acc-info"><div class="acc-name">${esc(a.username)}</div><div class="acc-handle">${esc(a.displayName||'')}</div></div>
            ${a.id===S.activeId?`<span class="acc-check">✓</span>`:''}
          </button>`).join('')}
        </div>
        <div class="settings-label" style="margin-top:20px">Add New Account</div>
        <div class="new-acc-form">
          <div class="avatar-upload-wrap">
            <img class="avatar-preview" id="new-acc-avatar-preview" src="${makeAvatar('?','#555',120)}" alt="avatar">
            <div>
              <p style="font-size:13px;color:var(--muted);margin-bottom:6px">Profile picture</p>
              <button class="avatar-upload-btn">
                Choose photo
                <input type="file" accept="image/*" onchange="handleNewAccAvatar(this.files[0])">
              </button>
            </div>
          </div>
          <input class="new-acc-input" id="new-username" placeholder="Username (e.g. john_doe)" maxlength="24">
          <input class="new-acc-input" id="new-displayname" placeholder="Display name (e.g. John Doe)">
          <textarea class="new-acc-input" id="new-bio" placeholder="Bio — this also shapes the AI personality when chatting" rows="2" style="resize:none"></textarea>
          <button class="new-acc-btn" onclick="addNewAccount()">➕ Create Account</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Danger Zone</div>
        <button onclick="resetData()" style="background:transparent;border:1px solid var(--like);color:var(--like);border-radius:8px;padding:8px 16px;font-weight:600;font-size:14px">Reset all data</button>
      </div>
    </div>
  </div>`);
}

function handleNewAccAvatar(file){
  if(!file)return;
  openCropModal(file,(croppedUrl)=>{
    newAccAvatarUrl=croppedUrl;
    const preview=document.getElementById('new-acc-avatar-preview');
    if(preview)preview.src=croppedUrl;
  });
}

function addNewAccount(){
  const u=(document.getElementById('new-username')?.value||'').trim().toLowerCase().replace(/[^a-z0-9._]/g,'');
  const d=(document.getElementById('new-displayname')?.value||'').trim();
  const bio=(document.getElementById('new-bio')?.value||'').trim();
  if(!u){showToast('Please enter a username');return;}
  if(u.length<2){showToast('Username must be at least 2 characters');return;}
  if(S.accounts.find(a=>a.username===u)){showToast('Username already taken');return;}
  const colors=['#e11d48','#7c3aed','#0ea5e9','#10b981','#f59e0b','#ec4899','#14b8a6','#f97316'];
  const color=colors[Math.floor(Math.random()*colors.length)];
  const newAcc={id:uid(),username:u,displayName:d||u,bio,color,avatarUrl:newAccAvatarUrl||makeAvatar(u,color,200),createdAt:Date.now()};
  S.accounts.push(newAcc);
  S.activeId=newAcc.id;S.profileId=newAcc.id;
  newAccAvatarUrl=null;
  persist();clearModal();S.view='profile';render();showToast(`@${u} created! 🎉`);
}

function switchAccount(id){
  const acc=getAccount(id);if(!acc)return;
  S.activeId=id;S.profileId=id;S.activeConvId=null;
  persist();clearModal();render();showToast(`Switched to @${acc.username} ✓`);
}

function openEditProfileModal(){
  const acc=getActive();if(!acc)return;
  wrapModal(`<div class="settings-modal">
    <div class="settings-hdr">Edit Profile</div>
    <div class="settings-body">
      <div class="settings-section">
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:20px">
          <img id="edit-avatar-preview" src="${getAvatar(acc)}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:1px solid var(--border)">
          <button class="avatar-upload-btn" style="position:relative;overflow:hidden">
            Change photo
            <input type="file" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%" onchange="handleEditAvatar('${acc.id}',this.files[0])">
          </button>
        </div>
        <div class="settings-label">Display name</div>
        <input class="settings-input" id="edit-displayname" value="${esc(acc.displayName||'')}">
        <div class="settings-label" style="margin-top:14px">Bio</div>
        <textarea class="settings-input" id="edit-bio" rows="3" style="resize:none">${esc(acc.bio||'')}</textarea>
        <button class="settings-save" style="margin-top:16px" onclick="saveProfileEdit('${acc.id}')">Save</button>
      </div>
    </div>
  </div>`);
}

function handleEditAvatar(accountId,file){
  if(!file)return;
  openCropModal(file,(croppedUrl)=>{
    const acc=getAccount(accountId);
    if(acc){acc.avatarUrl=croppedUrl;}
    const preview=document.getElementById('edit-avatar-preview');
    if(preview)preview.src=croppedUrl;
  });
}

function saveProfileEdit(accountId){
  const acc=getAccount(accountId);if(!acc)return;
  acc.displayName=(document.getElementById('edit-displayname')?.value||'').trim()||acc.username;
  acc.bio=(document.getElementById('edit-bio')?.value||'').trim();
  persist();clearModal();render();showToast('Profile updated ✓');
}

// ═══════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════
function toggleLike(postId){
  const post=S.posts.find(p=>p.id===postId);if(!post||!S.activeId)return;
  if(!Array.isArray(post.likes))post.likes=[];
  const idx=post.likes.indexOf(S.activeId);
  if(idx===-1)post.likes.push(S.activeId);else post.likes.splice(idx,1);
  persist();
}

function toggleSave(postId){
  const idx=S.saved.indexOf(postId);
  if(idx===-1)S.saved.push(postId);else S.saved.splice(idx,1);
  persist();showToast(idx===-1?'Saved!':'Removed from saved');
}

function toggleFollow(targetId){
  if(!S.activeId||targetId===S.activeId)return;
  const idx=S.follows.findIndex(f=>f.followerId===S.activeId&&f.followingId===targetId);
  if(idx===-1)S.follows.push({followerId:S.activeId,followingId:targetId});
  else S.follows.splice(idx,1);
  persist();
}

function addComment(postId,text){
  const post=S.posts.find(p=>p.id===postId);if(!post||!text.trim()||!S.activeId)return;
  post.comments.push({id:uid(),fromId:S.activeId,text:text.trim(),likes:[],createdAt:Date.now()});
  persist();
}

function quickComment(input){
  const text=input.value.trim();const postId=input.dataset.post;
  if(!text||!postId)return;
  addComment(postId,text);
  input.value='';input.nextElementSibling.classList.remove('on');
  const post=S.posts.find(p=>p.id===postId);
  if(post){
    const card=document.querySelector(`[data-post-id="${postId}"]`);
    if(card){const vcBtn=card.querySelector('.post-view-comments');if(vcBtn)vcBtn.textContent=`View all ${post.comments.length} comments`;}
  }
}

function setView(v){
  S.view=v;
  if(v==='profile')S.profileId=S.profileId||S.activeId;
  persist();render();
}
function viewProfile(id){S.profileId=id;S.view='profile';persist();render();}
function resetData(){if(!confirm('Reset all data? This cannot be undone.'))return;localStorage.removeItem(SK);localStorage.removeItem(AI_SK);location.reload();}

// ═══════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════
init();
</script>
</body>
</html>
